<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Tanner-OS Browser</title>
		<link rel="stylesheet" href="/index.css" />
		<script src="/bootstrap-init.js"></script>
	</head>
	<body>
		<header class="browser-shell">
			<div class="tab-row">
				<div id="tabs" class="tabs" role="tablist" aria-label="Browser tabs"></div>
				<button id="new-tab" class="new-tab" type="button" aria-label="New tab" title="New tab">+</button>
			</div>
			<div class="address-row">
				<div class="nav-controls">
					<button id="back" type="button" aria-label="Back" title="Back">‹</button>
					<button id="forward" type="button" aria-label="Forward" title="Forward">›</button>
					<button id="reload" type="button" aria-label="Reload" title="Reload">↻</button>
				</div>
				<form id="address-form" autocomplete="off">
					<input id="address" name="address" type="text" spellcheck="false" placeholder="Search Brave or enter a website" aria-label="Search Brave or enter a website" />
					<button type="submit" aria-label="Go">Go</button>
				</form>
			</div>
		</header>
		<main id="pages" aria-live="polite"></main>
		<div id="status" class="status" role="status" aria-live="polite"></div>
		<script src="/index.js"></script>
	</body>
</html>
